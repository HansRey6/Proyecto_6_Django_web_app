{% extends 'base.html' %}

{% block title %}Formulario tarea{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="surface-panel">
            <h1 class="mb-4">Tarea</h1>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}

                <button type="submit" class="btn btn-primary">Guardar</button>
                <a href="{% url 'proyecto_list' %}" class="btn btn-outline-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>

{% endblock %}
