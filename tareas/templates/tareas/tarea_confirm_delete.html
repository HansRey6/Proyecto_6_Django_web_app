{% extends 'base.html' %}

{% block title %}Eliminar tarea{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="surface-panel">
            <h1 class="mb-4">Eliminar tarea</h1>

            <div class="notice mb-4">
                ¿Seguro que deseas eliminar "{{ object.titulo }}"? Esta acción no se puede deshacer.
            </div>

            <form method="post">
                {% csrf_token %}

                <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                <a href="{% url 'proyecto_detail' object.proyecto.pk %}" class="btn btn-outline-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>

{% endblock %}
