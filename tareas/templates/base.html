<!doctype html>
{% load static %}
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Gestor de tareas{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'tareas/css/theme.css' %}" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg site-navbar mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'proyecto_list' %}">Gestor de proyectos</a>

            <div class="d-flex align-items-center ms-auto">
                {% if user.is_authenticated %}
                    <span class="navbar-text me-3">
                        Hola, {{ user.username }}
                    </span>

                    <form method="post" action="{% url 'logout' %}" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-navy-inverse btn-sm">Salir</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-navy-inverse btn-sm me-2">Ingresar</a>
                    <a href="{% url 'registro' %}" class="btn btn-brass btn-sm">Registrarse</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
